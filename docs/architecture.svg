<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B66"/>
    </marker>
    <style>
      .box  { fill:#FFFFFF; stroke:#DCE3DF; stroke-width:1.5; rx:4; }
      .gate { fill:#FBF6EC; stroke:#A9761C; stroke-width:1.5; rx:4; }
      .core { fill:#E7F0EE; stroke:#1F6F6B; stroke-width:1.5; rx:4; }
      .t    { font-size:13px; fill:#14231F; font-weight:600; }
      .s    { font-size:11px; fill:#5B6B66; }
      .lbl  { font-size:10.5px; fill:#8C9A95; letter-spacing:.12em; }
      .ln   { stroke:#5B6B66; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
      .dsh  { stroke:#8C9A95; stroke-width:1.1; fill:none; stroke-dasharray:4 3; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="940" height="500" fill="#F6F7F5"/>
  <text x="30" y="34" class="t" font-size="16">Anamnesis — request path</text>
  <text x="30" y="54" class="s">Every answer is either grounded in a retrieved passage, computed from a synthetic record, or refused.</text>

  <!-- question -->
  <rect class="box" x="30" y="90" width="150" height="58"/>
  <text x="45" y="115" class="t">Question</text>
  <text x="45" y="133" class="s">HTTP POST /api/ask</text>

  <!-- safety gate -->
  <rect class="gate" x="215" y="82" width="170" height="74"/>
  <text x="230" y="106" class="t">Safety gate</text>
  <text x="230" y="124" class="s">no clinical advice</text>
  <text x="230" y="140" class="s">no writes</text>

  <!-- refusal -->
  <rect class="box" x="215" y="196" width="170" height="52" stroke="#8E3B3B"/>
  <text x="230" y="219" class="t" fill="#8E3B3B">Refusal + referral</text>
  <text x="230" y="236" class="s">to the responsible clinician</text>

  <!-- planner -->
  <rect class="core" x="420" y="82" width="180" height="74"/>
  <text x="435" y="106" class="t">Planner</text>
  <text x="435" y="124" class="s">LLM tool calling, or</text>
  <text x="435" y="140" class="s">deterministic router (offline)</text>

  <!-- tools -->
  <rect class="box" x="420" y="196" width="180" height="150"/>
  <text x="435" y="220" class="lbl">FIVE READ-ONLY TOOLS</text>
  <text x="435" y="244" class="s">search_policy</text>
  <text x="435" y="266" class="s">find_patient</text>
  <text x="435" y="288" class="s">get_appointments</text>
  <text x="435" y="310" class="s">get_bed_availability</text>
  <text x="435" y="332" class="s">get_lab_results</text>

  <!-- knowledge side -->
  <rect class="box" x="655" y="196" width="255" height="66"/>
  <text x="670" y="220" class="t">Vector index</text>
  <text x="670" y="238" class="s">Markdown policy library, chunked by</text>
  <text x="670" y="253" class="s">section, cosine search over NumPy</text>

  <!-- data side -->
  <rect class="box" x="655" y="286" width="255" height="66"/>
  <text x="670" y="310" class="t">SQLite — synthetic records</text>
  <text x="670" y="328" class="s">patients · appointments · wards · labs</text>
  <text x="670" y="343" class="s">generated from a fixed seed</text>

  <!-- answer -->
  <rect class="core" x="420" y="392" width="490" height="72"/>
  <text x="435" y="416" class="t">Answer envelope</text>
  <text x="435" y="434" class="s">answer text · tools called · cited document and section · safety verdict</text>
  <text x="435" y="452" class="s">mode: which provider produced the text, and whether it is generative at all</text>

  <!-- lines -->
  <path class="ln" d="M180 119 H210"/>
  <path class="ln" d="M300 156 V192"/>
  <text x="308" y="180" class="s">blocked</text>
  <path class="ln" d="M385 119 H415"/>
  <text x="392" y="110" class="s">allowed</text>
  <path class="ln" d="M510 156 V192"/>
  <path class="ln" d="M600 240 H650"/>
  <path class="ln" d="M600 300 H650"/>
  <path class="dsh" d="M782 262 V282"/>
  <path class="ln" d="M510 346 V388"/>
  <path class="dsh" d="M385 222 H418 M418 222 V388" />
</svg>
